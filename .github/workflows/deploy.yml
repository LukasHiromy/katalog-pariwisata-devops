name: CI/CD Pipeline Katalog Pariwisata

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest # Menggunakan runner cloud dari GitHub Actions
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Tahap Backend: Java Spring Boot
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Compile & Test Backend
        working-directory: ./product_service
        run: mvn clean test

      # Tahap Frontend: React Vite
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Install & Build Frontend
        working-directory: ./frontend-service
        run: |
          npm install
          npm run build

  containerize:
    needs: build-and-test # Menunggu tahap testing selesai
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Backend Image
        working-directory: ./product_service
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/katalog-backend:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/katalog-backend:latest

      - name: Build & Push Frontend Image
        working-directory: ./frontend-service
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/katalog-frontend:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/katalog-frontend:latest

  local-deployment:
    needs: containerize # Menunggu image berhasil di-push ke Docker Hub
    runs-on: self-hosted
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to Local K3s Cluster
        working-directory: ./k8s
        run: |
          kubectl apply -f redis-postgres.yaml
          kubectl apply -f backend.yaml
          kubectl apply -f frontend.yaml
          kubectl apply -f ingress.yaml
          
      - name: Trigger Rolling Update
        run: |
          # Memaksa K3s menarik image latest dan memperbarui pod tanpa downtime
          kubectl rollout restart deployment/backend-deployment -n default
          kubectl rollout restart deployment/frontend-deployment -n default
